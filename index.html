<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thu Chi Pro</title>
    <script>
        // Global Error Handler
        window.onerror = function (message, source, lineno, colno, error) {
            showError('JS Error: ' + message + '\nAt: ' + source + ':' + lineno + ':' + colno);
        };

        // Resource Loading Error Handler (Capture Phase)
        window.addEventListener('error', function (event) {
            if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
                showError('Resource Load Failed: ' + (event.target.src || event.target.href));
            }
        }, true);

        // Unhandled Promise Rejection Handler
        window.addEventListener('unhandledrejection', function (event) {
            showError('Unhandled Promise: ' + event.reason);
        });

        function showError(msg) {
            var el = document.getElementById('global-error-display');
            if (!el) {
                el = document.createElement('div');
                el.id = 'global-error-display';
                el.style.position = 'fixed';
                el.style.top = '0';
                el.style.left = '0';
                el.style.width = '100%';
                el.style.height = '100%'; // Full screen
                el.style.background = 'rgba(255, 235, 238, 0.95)'; // Light red
                el.style.color = '#b71c1c';
                el.style.padding = '20px';
                el.style.zIndex = '99999';
                el.style.fontSize = '16px';
                el.style.fontFamily = 'monospace';
                el.style.whiteSpace = 'pre-wrap';
                el.style.overflow = 'auto';
                document.body.appendChild(el);
            }
            el.textContent += '\n----------------\n' + msg;
        }
    </script>
</head>

<body>
    <!-- Initial Loading State: If this stays visible, JS didn't mount -->
    <div id="root">
        <div
            style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #181920; color: white;">
            <h1>🚀 Loading Application...</h1>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
