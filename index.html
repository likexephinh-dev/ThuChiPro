<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Quản lý Thu Chi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      border-bottom: 1px solid #ddd;
      padding: 8px 0;
    }
  </style>
</head>

<body>
  <h2>💰 Quản lý Thu – Chi</h2>

  <!-- FORM NHẬP DỮ LIỆU -->
  <input id="amount" type="number" placeholder="Số tiền" />
  
  <select id="type">
    <option value="income">Thu</option>
    <option value="expense">Chi</option>
  </select>

  <input id="category" placeholder="Danh mục (VD: Ăn uống)" />
  <input id="description" placeholder="Ghi chú" />

  <button onclick="addTransaction()">➕ Thêm giao dịch</button>

  <hr />

  <h3>📋 Danh sách giao dịch</h3>
  <ul id="transaction-list"></ul>

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js"></script>
</body>
</html>
